<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Afisz z wyszukiwarką zdaniową — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="font-family: 'DM Sans', 'Helvetica Neue', sans-serif; color: #1C1B19; background: #FFFFFF; min-height: 1180px; box-sizing: border-box; padding: 28px 40px 48px">
  <header style="display: flex; justify-content: space-between; align-items: stretch; gap: 40px; flex-wrap: wrap; border-bottom: 4px solid #1C1B19; padding-bottom: 28px">
    <div style="display: flex; flex-direction: column; justify-content: space-between; gap: 20px; flex: 1 1 560px; min-width: 0">
      <a href="#" style="font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-weight: 800; font-size: 22px; color: #1C1B19; text-decoration: none; letter-spacing: -0.02em">wydarzenia<span style="color: {{accent}}">.</span></a>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.7; font-weight: 500; letter-spacing: -0.01em; max-width: 760px">Pokaż mi
        <button onClick="{{nextCat}}" aria-label="Zmień kategorię" style="font: inherit; font-weight: 600; color: #9A3412; background: #FDEDE4; border: 0; border-bottom: 2px solid {{accent}}; border-radius: 10px 10px 3px 3px; padding: 0 12px; cursor: pointer">{{catLabel}} ▾</button>
        <button onClick="{{nextArea}}" aria-label="Zmień miejsce" style="font: inherit; font-weight: 600; color: #9A3412; background: #FDEDE4; border: 0; border-bottom: 2px solid {{accent}}; border-radius: 10px 10px 3px 3px; padding: 0 12px; cursor: pointer">{{areaLabel}} ▾</button>,
        <button onClick="{{nextWhen}}" aria-label="Zmień dni" style="font: inherit; font-weight: 600; color: #9A3412; background: #FDEDE4; border: 0; border-bottom: 2px solid {{accent}}; border-radius: 10px 10px 3px 3px; padding: 0 12px; cursor: pointer">{{whenLabel}} ▾</button>
        <button onClick="{{nextTime}}" aria-label="Zmień porę dnia" style="font: inherit; font-weight: 600; color: #9A3412; background: #FDEDE4; border: 0; border-bottom: 2px solid {{accent}}; border-radius: 10px 10px 3px 3px; padding: 0 12px; cursor: pointer">{{timeLabel}} ▾</button>.
      </h1>
      <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
        <span style="font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">5—11.10</span>
        <span style="font-size: 15px; color: #4A4844">{{countLabel}}</span>
        <button onClick="{{reset}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #E4E2DD; background: #FFFFFF; font: inherit; font-size: 14px; cursor: pointer; color: #1C1B19">Wyczyść</button>
      </div>
    </div>
    <figure aria-label="Mapa z numerami wydarzeń" style="margin: 0; width: 520px; height: 340px; border-radius: 18px; overflow: hidden; position: relative; background: #F5F4F1; flex-shrink: 0">
      <svg viewBox="0 0 1000 700" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="display: block; position: absolute; inset: 0">
        <rect width="1000" height="700" fill="#F5F4F1"></rect>
        <path d="M720 380 C800 360 880 400 900 470 C910 540 830 580 760 560 C700 540 680 420 720 380Z" fill="#E6EADF"></path>
        <path d="M60 520 C120 500 200 530 210 590 C220 650 120 680 70 650 C30 620 20 550 60 520Z" fill="#E6EADF"></path>
        <g stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"><path d="M0 420 L1000 380"></path><path d="M0 560 L1000 600"></path><path d="M200 0 L260 700"></path><path d="M470 0 L430 700"></path><path d="M700 0 L660 700"></path><path d="M80 120 L940 80"></path></g>
        <g stroke="#FFFFFF" stroke-width="5" fill="none"><path d="M0 480 L1000 470"></path><path d="M340 0 L360 700"></path><path d="M580 0 L560 700"></path><path d="M820 0 L860 700"></path><path d="M100 330 L900 330"></path></g>
        <path d="M-20 260 C120 230 220 300 330 270 C440 240 480 170 580 190 C680 210 700 300 820 280 C900 266 960 220 1020 230" fill="none" stroke="#BFD7EA" stroke-width="34" stroke-linecap="round"></path>
        <path d="M330 270 C380 320 470 330 540 300" fill="none" stroke="#BFD7EA" stroke-width="16"></path>
      </svg>
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="8">
        <span style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; border: 2px solid #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(28,27,25,0.18)">{{p.no}}</span>
      </sc-for>
      <a href="#" style="position: absolute; right: 12px; bottom: 12px; height: 44px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; color: #1C1B19; text-decoration: none; display: flex; align-items: center; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(28,27,25,0.10)">Pełna mapa →</a>
    </figure>
  </header>

  <section aria-label="Program tygodnia" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 8px">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="7">
      <div style="padding: 20px 14px 24px; border-left: 1px solid #E4E2DD; background: {{c.bg}}; display: flex; flex-direction: column; gap: 20px; min-height: 620px">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #4A4844; font-weight: 600">{{c.name}}</span>
          <span style="font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; font-size: 64px; font-weight: 800; line-height: 1; color: {{c.numColor}}; letter-spacing: -0.04em">{{c.n}}</span>
        </div>
        <sc-for list="{{c.items}}" as="e" hint-placeholder-count="2">
          <a href="#" style="display: flex; flex-direction: column; gap: 4px; color: #1C1B19; text-decoration: none">
            <span style="position: relative; display: block; height: 104px; border-radius: 12px; background: {{e.img}}; overflow: hidden">
              <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #4A4844">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A4844" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>[zdjęcie]
              </span>
              <span style="position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; border: 2px solid #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{e.no}}</span>
            </span>
            <span style="font-size: 14px; font-weight: 600; color: #9A3412; margin-top: 6px">{{e.time}} · {{e.cat}}</span>
            <span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{e.title}}</span>
            <span style="font-size: 13px; color: #4A4844">{{e.place}}</span>
          </a>
        </sc-for>
        <sc-if value="{{c.empty}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 14px; color: #6B6862; font-style: italic; padding-top: 14px; border-top: 1px solid #E4E2DD">{{c.emptyText}}</span>
        </sc-if>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#047857","#7E22CE"]},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 0, area: 0, when: 0, time: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const CATS = [['wszystko', null], ['muzykę na żywo', 'Muzyka'], ['kino', 'Film'], ['coś do jedzenia', 'Jedzenie'], ['ruch i spacery', 'Ruch'], ['warsztaty', 'Warsztaty']];
    const AREAS = [['w całym mieście', null], ['na Nadodrzu', 'Nadodrze'], ['na Starym Mieście', 'Stare Miasto'], ['na Ostrowie i wyspach', 'Ostrów'], ['w Śródmieściu', 'Śródmieście'], ['na Ołbinie', 'Ołbin']];
    const WHEN = ['w tym tygodniu', 'w weekend', 'w dni powszednie'];
    const TIME = ['o każdej porze', 'wieczorem', 'w ciągu dnia'];
    const DAYS = [['Poniedziałek', '5'], ['Wtorek', '6'], ['Środa', '7'], ['Czwartek', '8'], ['Piątek', '9'], ['Sobota', '10'], ['Niedziela', '11']];
    const TINT = { Muzyka: '#F3E3D8', Film: '#DDE6EE', Jedzenie: '#EDE6D6', Ruch: '#E3EADB', Warsztaty: '#EBE1E8', Sztuka: '#E6E3EE', Spotkania: '#EFE6DC', Komedia: '#F1E6D2' };
    const EV = [
      { no: 1, d: 0, time: '19:00', title: 'Koncert chóralny w katedrze', place: 'Ostrów Tumski', cat: 'Muzyka', area: 'Ostrów', x: 63, y: 27 },
      { no: 2, d: 1, time: '18:00', title: 'Wystawa: miasto po zmroku', place: 'Muzeum Narodowe', cat: 'Sztuka', area: 'Śródmieście', x: 64, y: 47 },
      { no: 3, d: 2, time: '18:30', title: 'Wieczór gier planszowych', place: 'Śródmieście', cat: 'Spotkania', area: 'Śródmieście', x: 74, y: 80 },
      { no: 4, d: 3, time: '20:00', title: 'Stand-up w piwnicy', place: 'Rynek', cat: 'Komedia', area: 'Stare Miasto', x: 47, y: 65 },
      { no: 5, d: 3, time: '21:30', title: 'Koncert w podwórku', place: 'Nadodrze', cat: 'Muzyka', area: 'Nadodrze', x: 33, y: 23 },
      { no: 6, d: 4, time: '19:00', title: 'Jazz nad Odrą', place: 'Bulwar Dunikowskiego', cat: 'Muzyka', area: 'Ostrów', x: 54, y: 41 },
      { no: 7, d: 4, time: '20:30', title: 'Kino plenerowe', place: 'Wyspa Słodowa', cat: 'Film', area: 'Ostrów', x: 44, y: 32 },
      { no: 8, d: 5, time: '10:00', title: 'Targ producentów', place: 'Hala Stulecia', cat: 'Jedzenie', area: 'Śródmieście', x: 80, y: 63 },
      { no: 9, d: 5, time: '14:00', title: 'Spacer po podwórkach', place: 'Nadodrze', cat: 'Ruch', area: 'Nadodrze', x: 28, y: 17 },
      { no: 10, d: 5, time: '21:00', title: 'Nocny bieg', place: 'Ostrów Tumski', cat: 'Ruch', area: 'Ostrów', x: 58, y: 33 },
      { no: 11, d: 6, time: '12:00', title: 'Warsztaty ceramiki', place: 'Ołbin', cat: 'Warsztaty', area: 'Ołbin', x: 68, y: 16 },
      { no: 12, d: 6, time: '18:00', title: 'Recital organowy', place: 'Kościół przy Rynku', cat: 'Muzyka', area: 'Stare Miasto', x: 50, y: 69 }
    ];
    const s = this.state;
    const dayOk = (d) => s.when === 0 || (s.when === 1 ? d >= 5 : d < 5);
    const match = (e) => {
      const h = parseInt(e.time, 10);
      return (CATS[s.cat][1] === null || CATS[s.cat][1] === e.cat)
        && (AREAS[s.area][1] === null || AREAS[s.area][1] === e.area)
        && dayOk(e.d)
        && (s.time === 0 || (s.time === 1 ? h >= 17 : h < 17));
    };
    const hits = EV.filter(match);
    const plural = (c) => c === 0 ? 'Nic nie pasuje — zmień któreś słowo' : c === 1 ? '1 wydarzenie pasuje' : (c < 5 ? c + ' wydarzenia pasują' : c + ' wydarzeń pasuje');
    const cols = DAYS.map((d, i) => {
      const items = hits.filter((e) => e.d === i).map((e) => ({ ...e, img: TINT[e.cat] || '#EFEDE8' }));
      const inRange = dayOk(i);
      return {
        name: d[0], n: d[1], items,
        bg: !inRange ? '#F5F4F1' : (i >= 4 ? '#FBF8F4' : '#FFFFFF'),
        numColor: !inRange ? '#B5B2AB' : (i >= 4 ? accent : '#1C1B19'),
        empty: items.length === 0,
        emptyText: inRange ? 'Tego dnia nic pasującego.' : 'Poza wybranym zakresem.'
      };
    });
    const cycle = (key, len) => () => this.setState({ [key]: (s[key] + 1) % len });
    return {
      accent, cols, pins: hits,
      catLabel: CATS[s.cat][0], areaLabel: AREAS[s.area][0], whenLabel: WHEN[s.when], timeLabel: TIME[s.time],
      countLabel: plural(hits.length),
      nextCat: cycle('cat', CATS.length), nextArea: cycle('area', AREAS.length), nextWhen: cycle('when', WHEN.length), nextTime: cycle('time', TIME.length),
      reset: () => this.setState({ cat: 0, area: 0, when: 0, time: 0 })
    };
  }
}
</script>
</body>
</html>
