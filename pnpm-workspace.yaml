packages:
  - apps/*
  - packages/*

allowBuilds:
  # native fallback of the eslint resolver; the prebuilt binary comes from optional deps
  unrs-resolver: false
  # tsx's esbuild ships its binary as an optional platform package
  esbuild: false
  # OpenTelemetry's OTLP exporters pull it in; its postinstall only checks versions
  protobufjs: false
  # Downloads a binary for uploading source maps; not used until Sentry gets a DSN and an auth token
  '@sentry/cli': false
